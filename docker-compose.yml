# Any box you own: a VPS, a NAS, the machine under the stairs.
#   docker compose up -d
# Then open it and create the household account.
services:
  hearth:
    build: .
    image: hearth
    container_name: hearth
    restart: unless-stopped
    ports:
      - '4321:4321'
    volumes:
      - hearth-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4321/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hearth-data:
