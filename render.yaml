# Render Blueprint — https://render.com/docs/blueprint-spec
#
# New > Blueprint in the Render dashboard and point it at this repo. The first
# person to open the site creates the household account; there is nothing to
# configure here for sign-in.
#
# Two things are deliberate and load-bearing:
#   * the disk — the calendar is a JSON file, so without a mounted disk every
#     deploy would hand the family a blank week;
#   * one instance — that file is the source of truth, and a second instance
#     would quietly keep its own copy.
services:
  - type: web
    name: hearth
    runtime: node
    plan: starter # a disk cannot be mounted on Render's free instances
    region: frankfurt # oregon / ohio / virginia / singapore are the others
    branch: main
    numInstances: 1
    buildCommand: npm install --omit=dev # no dependencies; this is a formality
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: HEARTH_DATA
        value: /var/hearth/calendar.json
      # A real household starts with its own people, not the demo family. Drop
      # this line (or set it to "on") before the first deploy if you'd rather
      # land on sample data to click around.
      - key: HEARTH_SEED
        value: 'off'
    disk:
      name: hearth-data
      mountPath: /var/hearth
      sizeGB: 1
